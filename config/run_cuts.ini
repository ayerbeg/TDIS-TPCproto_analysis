# MANUAL REJECTION DATABASE -- shared by Python and C++/ROOT.
# Write the values to REMOVE, not the values to keep.
# Rules within a block are OR-ed: a hit matching ANY reject line is removed.
# Conditions joined by && on ONE line are AND-ed (channel AND time, etc.).
# A run uses [global] and its [run NNNN] block.
# Field names: Event, Channel, Hit, Time, Charge, Pedestal, Blockhead, FADC, Pad.
# Channel is zero-based ROOT electronics; FADC=Channel+1; Pad=-1 is unmapped.
# Rejection removes the HIT ROW from every cleaned plot, including mapped
# Pad plots. Channel==152, FADC==153, and Pad==0 select the same connected pad.
# Write them as alternatives: one rule is sufficient for that pad.
# Operators: == != < <= > >= ; in A..B (inclusive); in A,B,C (list).
# A leading # disables a rule. Text after # is a note, saved in the audit.

[global]
reject = Time >= 228                   # Existing common upper Time cut
# reject = Channel in 271,149            # Existing common excluded ROOT channels

[run 1615]
# Run-specific detector-cleaning rules; commented lines are inactive.

[run 1616]
# Run-specific detector-cleaning rules; commented lines are inactive.
# Active reject lines are applied. Commented examples below are inactive.
reject = Channel == 370               # ROOT370 = fADC371 = large Pad289
reject = Event in 13156..13157          # All hits in these event IDs
# reject = Channel in 40..45            # Inclusive channel range
# reject = Channel == 44 && Time >= 90 && Time < 95  # One channel/time bin region
# reject = Charge < 0                  # Values below a threshold
reject = Charge in 1600..1720               # Values above a threshold
# reject = FADC == 153                 # Same electronics as ROOT Channel 152
reject = Pad == 370                    # Large Pad370 = ROOT564 = fADC565
reject = Pad in 261..263             # Inclusive channel range
#reject = Time > 155
