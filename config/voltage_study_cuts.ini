# INDEPENDENT VOLTAGE STUDY ONLY -- shared by Python and C++/ROOT.
# This file is read only by the voltage-analysis command. Raw inspection
# and event displays do not read it. General detector cleaning belongs in
# run_cuts.ini; the voltage study applies BOTH files to the same hit rows.
# [global] here means every run within THIS STUDY. The same reject syntax
# and optional [run NNNN] blocks are supported as in run_cuts.ini.

[global]
reject = Channel >= 285                # Original comparison electronics range: ROOT channels 0-284
